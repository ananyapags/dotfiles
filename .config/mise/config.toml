[tools]
bat = "0.26.1"
coder = "2.35.3"
fzf = "0.74.2"
helm = "4.2.4"
hunk = "0.19.0"
jq = "1.8.2"
k9s = "0.51.0"
kubectl = "1.36.3"
kubectx = "0.11.0"
# explicit aqua backend: default is vfox, aqua checksum-verifies releases
"aqua:neovim/neovim" = "0.12.4"
starship = "1.26.0"
stern = "1.34.0"
# btop's mise package is linux-only; macOS gets btop from the Brewfile
btop = { version = "1.4.7", os = ["linux"] }
